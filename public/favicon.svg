<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nerd Neck">
  <rect width="64" height="64" rx="14" fill="#020617"/>
  <!-- Spine: the good posture curve, upright and stacked. -->
  <path d="M32 12v26" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="32" cy="20" r="7" fill="#22d3ee"/>
  <!-- Shoulders -->
  <path d="M17 44h30" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <!-- Arms dropping to the desk -->
  <path d="M17 44l-3 8M47 44l3 8" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
</svg>
